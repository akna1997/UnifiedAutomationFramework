name: Cross-Platform Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  repository_dispatch:
    types: [trigger-from-jenkins]

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode Terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Checkout gh-pages untukambil History Allure
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: 4. Copy History Lama ke Allure Results
        run: |
          mkdir -p target/allure-results
          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history target/allure-results/
          fi

      - name: 5. Jalankan Pengujian (Web Headless + API)
        run: mvn test -Dplatform=Web -Dheadless=true

      - name: 6. Generate Allure Static Report (dengan history)
        if: always()
        run: mvn allure:report

      - name: 7. Upload Report ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/allure-maven-plugin

      - name: 8. Simpan Report dan History ke gh-pages
        if: always()
        run: |
          DATE=$(date +%Y-%m-%d)
          RUN_NUM=$(jq 'length' gh-pages-history/history/history.json 2>/dev/null || echo 0)
          REPORT_DIR="gh-pages-history/reports/${DATE}-run${RUN_NUM}"

          mkdir -p "$REPORT_DIR"

          # Copy seluruh report
          cp -r target/site/allure-maven-plugin/* "$REPORT_DIR"/

          # Copy history juga
          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history/* target/site/allure-maven-plugin/history/
          fi

          cd gh-pages-history
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git diff-index --quiet HEAD || git commit -m "Add report ${DATE}-run${RUN_NUM}" && git push origin gh-pages

name: Cross-Platform Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  repository_dispatch:
    types: [trigger-from-jenkins]

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode Terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Checkout gh-pages untukambil History Allure
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: 4. Copy History Lama ke Allure Results
        run: |
          mkdir -p target/allure-results
          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history target/allure-results/
          fi

      - name: 5. Jalankan Pengujian (Web Headless + API)
        run: mvn test -Dplatform=Web -Dheadless=true

      - name: 6. Generate Allure Static Report (dengan history)
        if: always()
        run: mvn allure:report

      - name: 6b. Quality Gate - Pass Rate Check
        if: always()
        run: |
          PASSED=0
          FAILED=0
          BROKEN=0
          SKIPPED=0
          TOTAL=0
          
          if [ -d target/allure-results ]; then
            # Hitung file dengan status passed/failed/broken/skipped
            for f in target/allure-results/*-result.json; do
              [ -f "$f" ] || continue
              STATUS=$(jq -r '.status // "unknown"' "$f" 2>/dev/null)
              case "$STATUS" in
                passed) PASSED=$((PASSED + 1)) ;;
                failed) FAILED=$((FAILED + 1)) ;;
                broken) BROKEN=$((BROKEN + 1)) ;;
                skipped) SKIPPED=$((SKIPPED + 1)) ;;
              esac
            done
            TOTAL=$((PASSED + FAILED + BROKEN + SKIPPED))
          fi
          
          echo "=== Quality Gate Results ==="
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"
          echo "Broken:  $BROKEN"
          echo "Skipped: $SKIPPED"
          echo "Total:   $TOTAL"
          
          if [ "$TOTAL" -gt 0 ]; then
            RATE=$((PASSED * 100 / TOTAL))
            echo "Pass Rate: ${RATE}%"
            
            if [ "$RATE" -lt 100 ]; then
              echo "::error::Quality Gate FAILED: Pass rate ${RATE}% is below threshold 100%"
              exit 1
            fi
            
            echo "::notice::Quality Gate PASSED: Pass rate ${RATE}%"
          fi

      - name: 7. Simpan Report dan History ke gh-pages
        if: always()
        run: |
          DATE=$(date +%Y-%m-%d)
          REPORT_DIR="gh-pages-history/reports/${DATE}-${{ github.run_id }}"

          mkdir -p "$REPORT_DIR"

          cp -r target/site/allure-maven-plugin/* "$REPORT_DIR"/

          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history/* target/site/allure-maven-plugin/history/
          fi

          cd gh-pages-history
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git diff-index --quiet HEAD || git commit -m "Add report ${DATE}-${{ github.run_id }}" && git push origin gh-pages
          echo "::notice::Link Report : https://akna1997.github.io/UnifiedAutomationFramework/reports/${DATE}-${{ github.run_id }}"

      - name: 8. Simpan Raw Allure Results sebagai Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-raw
          path: target/allure-results/
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil Kode
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Download SDK + Buat AVD
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64"
          echo "y" | sdkmanager --licenses
          echo "no" | avdmanager create avd -n test_avd -k "system-images;android-34;google_apis;x86_64" --device "pixel_5" --force
          echo "=== CEK AVD KEBENTUK? ==="
          $ANDROID_HOME/emulator/emulator -list-avds

      - name: 5. Install Appium + uiautomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 6. Download ApiDemos APK dari Cloud (GitHub Release)
        run: |
          curl -L -o ApiDemos-debug.apk "https://github.com/appium/android-apidemos/releases/download/v6.0.15/ApiDemos-debug.apk"
          ls -la ApiDemos-debug.apk

      - name: 7. Start Emulator (background)
        run: |
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -no-audio -no-boot-anim &
          adb wait-for-device
          adb shell getprop sys.boot_completed | grep -c 1

      - name: 8. Install APK ke Emulator
        run: adb install ApiDemos-debug.apk

      - name: 9. Start Appium Server (background)
        run: appium &

      - name: 10. Jalankan Android Test
        run: mvn test -Dplatform=Android -Dtest=MobileRunner

      - name: 11. Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: 12. Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-android
          path: target/allure-results/
          retention-days: 30
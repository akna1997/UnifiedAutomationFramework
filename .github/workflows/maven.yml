name: Cross-Platform Automation CI

on:
  push:
    branches: [ "main", "master" ] # Berjalan otomatis saat kamu push ke branch main/master
  pull_request:
    branches: [ "main", "master" ]
  repository_dispatch:
    types: [trigger-from-jenkins]

jobs:
  automation-test:
    runs-on: ubuntu-latest # Menggunakan server Linux gratis dari GitHub (Chrome sudah pre-installed)

    steps:
      - name: 1. Ambil Kode Terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Mempercepat download library di eksekusi berikutnya

      - name: 3. Download Allure History (buat trend)
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: allure-history
          path: target/allure-results/history

      - name: 4. Clean old alure report
        run: rm -rf target/allure-results

      - name: 5. Jalankan Pengujian Web (Headless Mode)
        run: |
          mvn clean test -Dplatform="Web" -Dcucumber.filter.tags="@Web or @Api" -Dheadless="true"

      - name: 6. Generate Allure Static Report
        if: always()
        run: |
          mvn allure:report

      - name: 7. Upload Laporan ke GitHub Pages (Biar Bisa Diakses Online)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/allure-maven-plugin # Folder laporan statis kita

      - name: 7. Simpan Allure History untuk Trend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-history
          path: target/allure-results/history
          retention-days: 30

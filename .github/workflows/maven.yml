name: Cross-Platform Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  repository_dispatch:
    types: [trigger-from-jenkins]

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode Terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Ambil Run Sebelumnya
        id: get-prev-run
        run: |
          RUN_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&per_page=2" \
            | jq -r '.workflow_runs[1].id // empty')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: 4. Download Allure Results dari Run Sebelumnya
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-raw
          path: target/allure-results-history/
          run-id: ${{ steps.get-prev-run.outputs.run_id }}

      - name: 5. Gabungkan Hasil Lama + Baru
        run: |
          mkdir -p target/allure-results
          if [ -d target/allure-results-history ]; then
            cp -r target/allure-results-history/* target/allure-results/
          fi
          mvn test -Dplatform=Web -Dheadless=true

      - name: 6. Generate Allure Static Report
        if: always()
        run: |
          mvn allure:report

      - name: 7. Upload Laporan ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/allure-maven-plugin

      - name: 8. Simpan Raw Allure Results sebagai Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-raw
          path: target/allure-results/
          retention-days: 30
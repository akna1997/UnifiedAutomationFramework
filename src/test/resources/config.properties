#platform configuration web/android/ios
platform=Web

# Environment URLs
web.url=https://www.tokopedia.com
api.base.url=https://dummyjson.com

# Browser web configuration
browser=chrome
headless=false

# Android Capabilities
android.device.name=emulator-5554
android.automation.name=UiAutomator2
android.app.path=
android.appPackage=io.appium.android.apis
android.appActivity=io.appium.android.apis.ApiDemos
#jika menggunakan real device masukan udid nya
android.udid=

# iOS Capailities
ios.device.name=iPhone 15
ios.automation.name=XCUITest
ios.app.path=src/test/resources/apps/MyApp.app
#pakai ini kalau app SUDAH terinstall di device/sim yang path apus aja
ios.bundleId=com.yourapp.bundle
# isi kalau pakai real device, kosongkan kalau sim
ios.udid=
ios.platform.version=17.5

# Appium Server URL
appium.server.url=http://127.0.0.1:4723

# Implicit Wait Timeout (dalam detik)
timeout=10

# Untuk fitur AI assertion & AI .feature file generation
gemini.api.keys=